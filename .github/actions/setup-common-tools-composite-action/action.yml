name: 'Setup Common Tools'
description: 'A composite action that sets up & caches Gradle, and sets up Java.'
runs:
  using: 'composite'
  steps:
    - name: Setup Java
      uses: actions/setup-java@v5
      with:
        distribution: corretto
        java-version: 17
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v5
